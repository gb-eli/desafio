<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
  <title>Leitor de comprovante — Desafio DS</title>
  <link rel="stylesheet" href="css/style.css?v=16" />
  <style>
    body{overflow:auto}.validator{min-height:100vh;display:grid;place-items:center;padding:24px;background:#03060d}.validator-card{width:min(1100px,96vw);border:1px solid var(--line);background:rgba(5,10,18,.9);border-radius:28px;box-shadow:var(--shadow);padding:26px}.validator-card h1{font-size:42px;margin:10px 0}.validator-card textarea{width:100%;min-height:140px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:#020706;color:#baffd7;padding:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.output{margin-top:18px;white-space:pre-wrap;background:#07101d;border:1px solid var(--line);border-radius:18px;padding:16px;overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{border:1px solid rgba(255,255,255,.12);padding:8px;text-align:left}.table th{color:var(--accent)}
  </style>
</head>
<body class="class-ds1">
  <main class="validator">
    <section class="validator-card">
      <div class="terminal-label"><span class="pulse-dot"></span> LEITURA LOCAL</div>
      <h1>Comprovante Desafio DS</h1>
      <p class="token-info">Cole o comprovante gerado no final do jogo para abrir o relatório. Como o sistema roda somente no GitHub Pages, este arquivo confirma que o formato é legível, mas não funciona como assinatura antifraude.</p>
      <textarea id="tokenInput" placeholder="Cole o comprovante DDS8... aqui"></textarea>
      <div class="result-actions"><button id="validateBtn" class="btn primary">Abrir comprovante</button><button id="clearBtn" class="btn ghost">Limpar</button></div>
      <div id="output" class="output hidden"></div>
    </section>
  </main>
  <script src="js/crypto.js?v=16"></script>
  <script>
    const out = document.getElementById('output');
    const esc = value => String(value ?? '').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    document.getElementById('clearBtn').onclick = () => { document.getElementById('tokenInput').value=''; out.classList.add('hidden'); out.innerHTML=''; };
    document.getElementById('validateBtn').onclick = async () => {
      try{
        const token = document.getElementById('tokenInput').value.trim();
        const data = await DS_Crypto.decryptToken(token);
        out.classList.remove('hidden');
        const areas = Object.entries(data.areas || {}).map(([area,s]) => `<tr><td>${esc(area)}</td><td>${esc(s.acertos)}</td><td>${esc(s.erros)}</td><td>${esc(s.percentual)}%</td></tr>`).join('');
        const dificuldades = Object.entries(data.dificuldades || {}).map(([nivel,s]) => `<tr><td>Nível ${esc(nivel)}</td><td>${esc(s.acertos)}</td><td>${esc(s.erros)}</td><td>${esc(s.percentual)}%</td><td>${esc(s.tempo_medio_segundos)}s</td></tr>`).join('');
        const habilidades = Object.entries(data.habilidades || {}).map(([habilidade,s]) => `<tr><td>${esc(habilidade)}</td><td>${esc(s.acertos)}</td><td>${esc(s.erros)}</td><td>${esc(s.percentual)}%</td></tr>`).join('');
        const powerups = (data.powerups || []).map(p => `<li>${esc(p.tipo || '-')} • ${esc(p.origem || '-')} • fase ${esc(p.fase || '-')}</li>`).join('') || '<li>Nenhum power-up registrado.</li>'; 
        const bugs = (data.bugs_reportados || []).map(b => `<li><b>Fase ${esc(b.fase || '-')} — ${esc(b.area || '-')}</b><br>${esc(b.relato || '')}</li>`).join('') || '<li>Nenhum bug informado pelo aluno.</li>';
        const integridade = (data.detalhes_integridade || []).map(i => `<li>${esc(i.reason || '-')} • ${esc(i.warnings || 0)}/${esc(i.max || '-')} • fase ${esc(i.index || '-')} ${i.professor ? '• professor: '+esc(i.professor) : ''} ${i.justificativa ? '<br><small>Justificativa: '+esc(i.justificativa)+'</small>' : ''}</li>`).join('') || '<li>Nenhum alerta detalhado.</li>';
        const liberacoes = (data.liberacoes_professor || []).map(l => `<li><b>${esc(l.professor || 'Professor')}</b> • ${esc(l.horario || '-')} • fase ${esc(l.index || '-')} • alertas antes: ${esc(l.alertas_antes ?? '-')}<br><small>${esc(l.justificativa || '')}</small></li>`).join('') || '<li>Nenhuma liberação de prova registrada.</li>';
        const divergencias = (data.divergencias || []).map(d => `<li>${esc(d)}</li>`).join('') || '<li>Nenhuma divergência registrada.</li>';
        out.innerHTML = `<h2>${esc(data.jogador || '-')}</h2>
          <p><b>Turma:</b> ${esc(data.turma || '-')} | <b>Modo:</b> ${esc(data.modo_label || data.modo || '-')}</p>
          <p><b>Banco:</b> ${esc(data.banco_nome || data.banco || '-')} | <b>Versão do banco:</b> ${esc(data.banco_versao || '-')}</p>
          <p><b>Situação:</b> ${esc(data.situacao || '-')} | <b>Encerramento:</b> ${esc(data.encerramento || '-')}</p>
          <p><b>Pontuação:</b> ${esc(data.pontuacao || 0)} | <b>Precisão:</b> ${esc(data.precisao ?? 0)}% <small>(${esc(data.base_precisao || 'base não informada')})</small></p>
          <p><b>Início:</b> ${esc(data.inicio || '-')}<br><b>Fim:</b> ${esc(data.fim || '-')}</p>
          <p><b>Tempo total:</b> ${esc(data.tempo_total || '-')} | <b>Média por pergunta:</b> ${esc(data.tempo_medio_pergunta || '-')}</p>
          <p><b>Acertos:</b> ${esc(data.acertos || 0)} | <b>Erros:</b> ${esc(data.erros || 0)} | <b>Não respondidas:</b> ${esc(data.perguntas_nao_respondidas || 0)} | <b>Eventos:</b> ${esc(data.alertas_integridade || 0)} | <b>Críticos:</b> ${esc(data.alertas_criticos || 0)}</p>
          <p><b>Vidas restantes:</b> ${esc(data.vidas_restantes ?? '-')} | <b>Dicas restantes:</b> ${esc(data.dicas_restantes ?? '-')}</p>
          <p><b>Melhor área:</b> ${esc(data.melhor_area || '-')}</p>
          <p><b>Sessão:</b> ${esc(data.sessao || '-')} | <b>Comprovante ID:</b> ${esc(data.payload_checksum || data.token_checksum || '-')}</p>
          <h3>Áreas</h3><table class="table"><thead><tr><th>Área</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>${areas}</tbody></table>
          <h3>Dificuldade</h3><table class="table"><thead><tr><th>Nível</th><th>Acertos</th><th>Erros</th><th>%</th><th>Tempo médio</th></tr></thead><tbody>${dificuldades}</tbody></table>
          <h3>Habilidades</h3><table class="table"><thead><tr><th>Habilidade</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>${habilidades}</tbody></table>
          <h3>Power-ups</h3><ul>${powerups}</ul>
          <h3>Bugs informados pelo aluno</h3><ul>${bugs}</ul>
          <h3>Liberações por senha do professor</h3><ul>${liberacoes}</ul>
          <h3>Alertas de integridade</h3><ul>${integridade}</ul>
          <h3>Divergências automáticas</h3><ul>${divergencias}</ul>
          <h3>Dados do dispositivo/navegador</h3><pre>${JSON.stringify(data.cliente || {},null,2).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>
          <h3>JSON completo</h3><pre>${JSON.stringify(data,null,2).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>`;
      }catch(err){ out.classList.remove('hidden'); out.textContent = 'Não foi possível abrir esse comprovante. Verifique se foi copiado completo ou use o .TXT do aluno. Comprovantes de versões antigas podem não abrir nesta versão.\n\n' + err.message; }
    };
  </script>
</body>
</html>
